name: Build Jar

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip Project
        run: unzip recaptcha-solver-project.zip

      - name: Build Jar
        working-directory: recaptcha-solver
        run: mvn clean package -DskipTests

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: recaptcha-solver
          path: recaptcha-solver/target/*.jar
